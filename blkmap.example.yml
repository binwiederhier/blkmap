# blkmap device definition. Install as /etc/blkmap/<id>.yml and start it with
# "systemctl start blkmap@<id>"; the device appears as /dev/blkmap/<id>.
#
# Sizes accept K/M/G/T suffixes (binary). JSON is valid YAML, so a JSON file works too.

# Device size. Optional; defaults to the end of the last segment. If larger, the tail
# reads as zeros.
size: 10G

# Logical block size the kernel sees: 512 (default) or 4096.
block-size: 512

# Reject all writes at the kernel level. Default false.
read-only: false

# Where writes go. Both files are created on first start. The COW file is a sparse raw
# image of the overlay; the bitmap records which chunks live in it. Defaults shown.
cow:
  file: /var/lib/blkmap/example.cow
  bitmap: /var/lib/blkmap/example.cow.bitmap
  chunk-size: 64K

# Background hydration: copy the base into the COW file so the device eventually needs no
# source. Optional; the block's presence enables it. Guest I/O always has priority. The
# prefetch list is a file of "offset length" lines (binary suffixes, # comments), highest
# priority first; it is read at full speed, then the rest at "rate" (0 = unlimited). Once
# every chunk is in the COW file the sources are no longer opened on start.
hydrate:
  prefetch-list: /etc/blkmap/example.prefetch
  rest: true            # also hydrate what the list does not cover (default true)
  rate: 20M             # bytes/s cap for the rest phase
  use-cache: always     # always | never: whether background reads may use cache tiers
  concurrency: 4        # parallel background reads
  report-every: 30s     # progress line in the journal

# Optional: record every guest request ("millis R|W offset length" per line) to build a
# prefetch list from a real workload: blkmap prefetch FILE > list. Never overwritten; delete
# the file to record again.
#record:
#  file: /var/lib/blkmap/example.rec
#  max-duration: 60s    # default: until the device stops
#  max-size: 16M        # default 16M

# Segments in device order. "offset" is optional and defaults to the end of the previous
# segment; gaps read as zeros, overlaps are an error. "size" is required for zero segments
# and otherwise defaults to the rest of the source after "source-offset".
segments:
  - type: zero
    size: 1M
  - type: file
    path: /srv/images/part1.img
    source-offset: 0
    size: 100M
  - type: device
    path: /dev/sdb1
  - type: http
    offset: 5G
    url: https://example.com/disk.img
    size: 2G
    # Data-extent map of the image (make one with "blkmap map disk.img > disk.img.map" on
    # the server): holes are read as zeros locally and never fetched, and hydration moves
    # only the data. Any source type takes "map"; http also probes <url>.map by itself.
    map: https://example.com/disk.img.map
  # A fast cache in front of a slow origin. Any error from "fast" (a 404 from an HTTP cache,
  # a missing file) falls through to "slow", without retries; the cache is never written.
  # Both tiers accept every source type.
  - type: cache
    size: 2G
    fast:
      type: http
      url: http://cache.lan/images/disk.img
    slow:
      type: http
      url: https://origin.example.com/images/disk.img
  # A segment implemented by Go code that embeds blkmap: it registers a constructor under
  # this name with source.Register before loading the config. params are free-form strings.
  - type: custom
    name: synth-partition
    size: 1G
    params: {seed: "42"}
  # A RAID-5 set reassembled on the fly. Defaults match Windows dynamic disks (LDM): 64K
  # stripes, left-symmetric parity rotation. Members are in array order; one may be
  # missing and is rebuilt from parity. source-offset is where the array data starts on
  # that member (the LDM data partition, or md's data_offset).
  - type: raid5
    stripe-size: 64K
    layout: left-symmetric
    members:
      - type: device
        path: /dev/sdc
        source-offset: 1M
      - type: device
        path: /dev/sdd
        source-offset: 1M
      - missing: true
